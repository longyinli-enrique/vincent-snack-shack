<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snack Shack</title>
  <script>
    try {
      const savedTheme = localStorage.getItem("snack-shack-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {
      // The default theme remains available when storage is blocked.
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --font-heading: "Fraunces", Georgia, serif;
      --font-body: "Source Sans 3", sans-serif;
      --paper: #f8f4ec;
      --surface: #fffdf8;
      --text: #30291f;
      --muted: #6b5d4d;
      --accent: #8a482f;
      --accent-hover: #6c3725;
      --line: #d8cbbb;
      --control-line: #9a866e;
      --soft: #eee5d8;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #241f1a;
      --surface: #2e2721;
      --text: #f2eadd;
      --muted: #c7b9a6;
      --accent: #e2aa87;
      --accent-hover: #edbb9a;
      --line: #5b4d40;
      --control-line: #a9947d;
      --soft: #3a3028;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      font-size: 1.0625rem;
      font-weight: 400;
      font-optical-sizing: auto;
      line-height: 1.6;
      min-height: 100vh;
      color: var(--text);
      background: var(--paper);
    }

    a {
      color: inherit;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
    }

    button,
    input {
      font: inherit;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    h1,
    h2,
    h3,
    .logo {
      font-family: var(--font-heading);
      font-weight: 600;
    }

    .container {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 0;
      gap: 24px;
    }

    .logo {
      font-weight: 700;
      letter-spacing: -0.025em;
      font-size: clamp(1.5rem, 2.5vw, 1.9rem);
      line-height: 1.2;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 24px;
      font-weight: 600;
      color: var(--muted);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 28px;
    }

    .theme-toggle {
      min-height: 44px;
      padding: 7px 13px;
      border: 1px solid var(--control-line);
      border-radius: 3px;
      color: var(--text);
      background: var(--surface);
      font-weight: 600;
      cursor: pointer;
    }

    .theme-toggle:hover,
    .theme-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--soft);
    }

    .nav-links a {
      padding: 4px 0;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    h1 {
      font-size: clamp(2.75rem, 5vw, 4.25rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
    }

    h2 {
      font-size: clamp(1.75rem, 3vw, 2.4rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    section {
      padding: 48px 0;
    }

    .section-heading {
      margin-bottom: 24px;
    }

    .menu-intro {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      align-items: center;
      gap: 32px;
      margin-bottom: 40px;
    }

    .hero-image {
      display: block;
      width: 100%;
      max-width: 340px;
      height: auto;
      justify-self: end;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 320px) auto;
      align-items: center;
      gap: 24px;
      padding-bottom: 24px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: 100%;
      min-width: 0;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 3px;
      background: var(--surface);
      border: 1px solid var(--control-line);
    }

    .search::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      color: var(--muted);
      background: none;
      border: 0;
      border-bottom: 2px solid var(--line);
      padding: 8px 0;
      font-weight: 600;
      cursor: pointer;
    }

    .chip:hover,
    .chip.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .chip.active {
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 32px;
      row-gap: 36px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .snack-image {
      display: block;
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .menu-item h3 {
      font-size: 1.25rem;
      line-height: 1.35;
      margin-bottom: 8px;
      letter-spacing: -0.015em;
    }

    .item-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 16px;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .btn,
    .add-btn {
      cursor: pointer;
      padding: 7px 15px;
      border: 1px solid var(--accent);
      border-radius: 3px;
      font-weight: 600;
      color: var(--accent);
      background: var(--surface);
    }

    .add-btn:hover {
      color: var(--surface);
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-secondary {
      color: var(--muted);
      border-color: var(--control-line);
      background: var(--paper);
    }

    .btn-secondary:hover {
      color: var(--text);
      background: var(--soft);
    }

    .menu-summary {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 20px 0;
    }

    .menu-summary strong {
      font-variant-numeric: tabular-nums;
    }

    #visit {
      border-top: 1px solid var(--line);
      padding-bottom: 64px;
    }

    .visit-details,
    .empty-state p {
      color: var(--muted);
      max-width: 640px;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 16px 0;
    }

    .empty-state h3 {
      font-size: 1.3rem;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      inset-inline: 16px;
      bottom: 20px;
      width: fit-content;
      max-width: calc(100% - 32px);
      margin-inline: auto;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--text);
      background: var(--surface);
      text-align: center;
      visibility: hidden;
      pointer-events: none;
      z-index: 20;
    }

    .toast.show {
      visibility: visible;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .container {
        width: calc(100% - 32px);
      }

      .nav {
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
        padding: 20px 0;
      }

      .nav-actions {
        width: 100%;
        justify-content: space-between;
        gap: 12px 24px;
      }

      .menu-intro {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .hero-image {
        max-width: 280px;
        justify-self: center;
      }

      .toolbar {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
      }

      .filters {
        justify-content: flex-start;
      }

      .grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .menu-summary {
        align-items: flex-start;
        flex-direction: column;
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="#top" aria-label="Snack Shack home">
        <span>Snack Shack</span>
      </a>
      <div class="nav-actions">
        <nav class="nav-links" aria-label="Primary navigation">
          <a href="#menu">Menu</a>
          <a href="#visit">Visit information</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">Dark mode</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section id="menu" class="container">
      <div class="section-heading menu-intro">
        <h1>This week's menu</h1>
        <img class="hero-image" src="images/hero.png" alt="Assorted bags of chips with loose chips around them" width="880" height="880" fetchpriority="high" />
      </div>

      <div class="toolbar">
        <input class="search" id="searchInput" type="search" placeholder="Search snacks" aria-label="Search snacks" />
        <div class="filters" id="filters" aria-label="Menu filters"></div>
      </div>

      <div class="grid" id="snackGrid"></div>

      <div class="menu-summary" aria-live="polite">
        <div>
          You have selected <strong id="cartCount">0 items</strong>,
          with an estimated total of <strong id="cartTotal">$0.00</strong>.
        </div>
        <button class="btn btn-secondary" id="clearCart">Clear List</button>
      </div>
    </section>

    <section id="visit" class="container">
      <div class="section-heading">
        <h2>Visit information</h2>
      </div>
      <p class="visit-details">Snack Shack sells snacks near the main quad during lunch hours and accepts cash only.</p>
    </section>
  </main>

  <div class="toast" id="toast">The item has been added to your snack list.</div>

  <script>
    const themeToggle = document.getElementById("themeToggle");

    function setTheme(theme) {
      const isDark = theme === "dark";
      document.documentElement.dataset.theme = isDark ? "dark" : "light";
      themeToggle.setAttribute("aria-pressed", String(isDark));
    }

    setTheme(document.documentElement.dataset.theme);

    themeToggle.addEventListener("click", () => {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      setTheme(nextTheme);
      try {
        localStorage.setItem("snack-shack-theme", nextTheme);
      } catch {
        // Switching themes still works when storage is blocked.
      }
    });

    const snacks = [
      { name: "Cheetos Flamin' Hot Crunchy", category: "Chips", price: 1.50, image: "images/hot_cheeto.png" },
      { name: "Doritos Cool Ranch", category: "Chips", price: 1.25, image: "images/doritos.png" },
      { name: "Takis Fuego", category: "Chips", price: 1.50, image: "images/takis.png" },
      { name: "KitKat", category: "Candy", price: 1.50, image: "images/kitkat.png" },
      { name: "Reese's Peanut Butter Cups", category: "Candy", price: 1.50, image: "images/reeses.png" },
      { name: "Skittles Original", category: "Candy", price: 1.25, image: "images/skittles.png" },
      { name: "Sour Patch Kids", category: "Candy", price: 1.25, image: "images/sour_patch_kids.png" },
      { name: "Trolli Sour Brite Crawlers", category: "Candy", price: 1.25, image: "images/trolli.png" }
    ];

    const categories = ["All", ...new Set(snacks.map(item => item.category))];
    const snackGrid = document.getElementById("snackGrid");
    const filters = document.getElementById("filters");
    const searchInput = document.getElementById("searchInput");
    const cartCount = document.getElementById("cartCount");
    const cartTotal = document.getElementById("cartTotal");
    const clearCart = document.getElementById("clearCart");
    const toast = document.getElementById("toast");

    let activeCategory = "All";
    let cart = [];

    function formatMoney(value) {
      return value.toLocaleString("en-US", { style: "currency", currency: "USD" });
    }

    function renderFilters() {
      filters.innerHTML = categories.map(category => `
        <button class="chip ${category === activeCategory ? "active" : ""}" data-category="${category}">${category}</button>
      `).join("");
    }

    function renderSnacks() {
      const searchTerm = searchInput.value.trim().toLowerCase();
      const filtered = snacks.filter(item => {
        const matchesCategory = activeCategory === "All" || item.category === activeCategory;
        const matchesSearch = [item.name, item.category].join(" ").toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      snackGrid.innerHTML = filtered.length
        ? filtered.map(item => `
          <article class="menu-item">
            <img class="snack-image" src="${item.image}" alt="${item.name}" width="240" height="180" loading="lazy" decoding="async" />
            <h3>${item.name}</h3>
            <div class="item-actions">
              <span class="price">${formatMoney(item.price)}</span>
              <button class="add-btn" data-name="${item.name}">Add</button>
            </div>
          </article>
        `).join("")
        : `<div class="empty-state"><h3>No snacks match your selection.</h3><p>Try another search or choose a different category.</p></div>`;
    }

    function updateCart() {
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const label = cart.length === 1 ? "1 item" : `${cart.length} items`;
      cartCount.textContent = label;
      cartTotal.textContent = formatMoney(total);
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1600);
    }

    filters.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      activeCategory = button.dataset.category;
      renderFilters();
      renderSnacks();
    });

    searchInput.addEventListener("input", renderSnacks);

    snackGrid.addEventListener("click", event => {
      const button = event.target.closest("button[data-name]");
      if (!button) return;
      const item = snacks.find(snack => snack.name === button.dataset.name);
      cart.push(item);
      updateCart();
      showToast(`Your snack list now includes ${item.name}.`);
    });

    clearCart.addEventListener("click", () => {
      cart = [];
      updateCart();
      showToast("Your snack list is now empty.");
    });

    renderFilters();
    renderSnacks();
    updateCart();
  </script>
</body>
</html>
